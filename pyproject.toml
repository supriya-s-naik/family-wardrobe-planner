[project]
name = "wardrobe-planner"
version = "0.1.0"
description = "AI-powered family wardrobe and lifestyle planning prototype"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "langchain-openai>=0.2",
  "langgraph>=0.2",
  "langsmith>=0.1",
  "mem0ai>=0.1",
  "pinecone>=10,<11",
  "pydantic>=2.8",
  "python-dotenv>=1.0",
  "streamlit>=1.39",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
